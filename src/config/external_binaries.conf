;  File Converter Pro -- External Binaries Configuration
;
;  Some conversions rely on third-party command-line tools (7-Zip,
;  ffmpeg, Ghostscript, ImageMagick, LibreOffice, wkhtmltopdf, pandoc,
;  Tesseract, ...).
;
;  The application first tries to locate each tool automatically in this
;  order (see external_binaries.py -> resolve_binary):
;      1. system PATH
;      2. app-local directory
;      3. common system install folders
;  If none of those succeed, the path declared below is used instead.
;
;  Fill in the full path to the executable (with .exe on Windows):
;
;      ffmpeg = C:\ffmpeg\bin\ffmpeg.exe
;      Note: ffprobe is a companion tool to ffmpeg, and is usually located in the same folder.
;
;  Accepted value syntax:
;      - plain absolute paths            C:\tools\ffmpeg.exe
;      - environment variables           %LOCALAPPDATA%\ffmpeg\ffmpeg.exe
;      - home shortcut                   ~\ffmpeg\bin\ffmpeg.exe
;      - relative paths                  bin\ffmpeg.exe
;        (resolved against the folder that contains this config/ folder)
;
;  Leave a value empty (or delete the line) to keep automatic detection.

[binaries]

7z =
ffmpeg =
ffprobe =
ghostscript =
imagemagick =
libreoffice =
wkhtmltopdf =
pandoc =
tesseract =
