name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          grep -vE '^(pywin32|comtypes|winotify)' requirements.txt | pip install -r /dev/stdin
          pip install pytest

      - name: Run tests
        run: pytest tests/ -v
